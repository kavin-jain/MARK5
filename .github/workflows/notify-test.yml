name: Test the daily message

# Manual only. Exists so the notification channel can be verified — after a token
# rotation, a chat change, or a first-time setup — WITHOUT running the refresh job.
#
# That distinction matters. refresh.yml marks the book to market and commits to an
# append-only record; firing it on a non-trading day to "just test something" would
# stamp a weekend mark into the ledger, which Mandate §6 forbids outright. This job
# only reads and only sends: no marking, no commit, no push, contents: read.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "send = deliver the daily message · diagnose = find why it isn't arriving"
        type: choice
        default: send
        options: [send, diagnose]

permissions:
  contents: read

jobs:
  notify-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy

      - name: Send whatever the last recorded mark says
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        # --no-health because the health check reaches the live feed and the GitHub
        # API, and a red run here would say "the notification is broken" when the
        # thing under test is only the delivery path.
        #
        # `diagnose` exists so the owner never has to hold the token to debug this.
        # It lives in Actions secrets, which are write-only — there is no way to
        # read it back out — so the natural instinct is to revoke and reissue just
        # to run a test. Rotating a working credential to diagnose a delivery
        # problem is the wrong trade; run the diagnosis where the credential
        # already is instead.
        #
        # Safe in a public log: notify.py scrubs the token from anything it prints,
        # and GitHub masks registered secrets on top of that. Chat ids from
        # getUpdates do appear, and they are useless without the token.
        run: |
          if [ "${{ inputs.mode }}" = "diagnose" ]; then
            python scripts/notify.py --diagnose
          else
            python scripts/notify.py --send --no-health
          fi

      - name: Confirm a channel was actually configured
        # Without this the job passes green while sending nothing, which is the
        # worst outcome: it certifies a channel that does not exist.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] && [ -z "$NTFY_TOPIC" ]; then
            echo "::error::No channel configured — set TELEGRAM_BOT_TOKEN+TELEGRAM_CHAT_ID or NTFY_TOPIC"
            exit 1
          fi
