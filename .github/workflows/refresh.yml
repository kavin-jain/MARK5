name: Refresh live performance

# The research backtest is historical and does not change day to day; only the
# live paper book does, and that needs just ~22 quotes. So this job is small and
# fast rather than re-running the whole pipeline.
on:
  schedule:
    - cron: "30 11 * * 1-5"      # 17:00 IST, after the 15:30 NSE close
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy yfinance pyarrow

      - name: Mark the paper book to market
        run: |
          python scripts/paper_track.py status
          python scripts/paper_track.py export

      - name: Merge live data into the dashboard feed
        run: |
          python - <<'PY'
          import json, datetime
          doc  = json.load(open("docs/data/mark6.json"))
          live = json.load(open("data/paper/paper_export.json"))
          doc["live"] = live
          doc["generated"] = datetime.datetime.now(datetime.timezone.utc).astimezone().isoformat(timespec="seconds")
          json.dump(doc, open("docs/data/mark6.json", "w"), indent=1, default=float)
          print(f"live day {live['days_live']}  NAV {live['nav']:.0f}  {live['return_pct']:+.2f}%")
          PY

      - name: Rebuild the standalone dashboard from the feed
        # docs/index.html EMBEDS mark6.json rather than fetching it, so updating the
        # feed alone leaves the standalone page frozen at whatever it was built with.
        # It silently drifted 4 days and kept serving a superseded headline.
        run: python docs/build_dashboard.py

      - name: Commit if anything moved
        # Runs BEFORE the health check, deliberately. The ledger and NAV log are
        # append-only evidence: a day's mark that is computed but never committed
        # is a hole in the record that no later run backfills. Recording is
        # unconditional; judging what was recorded happens next.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/mark6.json docs/index.html data/paper/
          git diff --staged --quiet || git commit -m "chore: daily live refresh [skip ci]"
          git push

      - name: Health check (fails the run if an invariant broke)
        env:
          GH_TOKEN: ${{ github.token }}
        # No `|| echo`. healthcheck.py exits 1 on any FAIL and that is the whole
        # point of it: this step was named "fails the run if an invariant broke"
        # while swallowing the exit code, so 20+ checks could not stop anything.
        # A guard that cannot fail is decoration. Now the run goes red and the
        # failure is visible, without costing the day's mark.
        run: python scripts/healthcheck.py

      - name: Send the daily message
        # `always()` is the whole point. The 4-5 August outage went unnoticed for
        # two days because nothing in this system ever spoke first; a notifier
        # that stays silent exactly when the health check fails would recreate
        # that hole, and worse, silence would start to mean "fine".
        #
        # notify.py runs healthcheck itself rather than reading the step above.
        # Piping that step into a file would need `pipefail` to preserve its exit
        # code, and a health check that cannot turn the run red is decoration.
        # Twenty seconds of duplicated requests is the cheaper mistake.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/notify.py --send
