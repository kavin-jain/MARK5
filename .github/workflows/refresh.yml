name: Refresh live performance

# The research backtest is historical and does not change day to day; only the
# live paper book does, and that needs just ~22 quotes. So this job is small and
# fast rather than re-running the whole pipeline.
on:
  schedule:
    - cron: "30 11 * * 1-5"      # 17:00 IST, after the 15:30 NSE close
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy yfinance pyarrow matplotlib

      - name: Is a rebalance due?
        # Cheap: reads the book, touches no price data. Everything below keys off
        # it, because the rebalance needs a ~200-name price panel that is
        # GITIGNORED and therefore does not exist on a CI runner. Rebuilding it
        # costs minutes — fine twice a year, absurd daily.
        #
        # Without this split the job would have sailed through every day until
        # January, then failed unattended on a missing cache, with the mark and
        # commit steps stranded behind it. It was found by asking what this job
        # would actually do on the one day it matters.
        id: due
        run: |
          OUT=$(python scripts/paper_track.py rebalance --check)
          echo "$OUT"
          case "$OUT" in
            DUE*)     echo "due=true"  >> "$GITHUB_OUTPUT"
                      echo "prep=true" >> "$GITHUB_OUTPUT";;
            PREVIEW*) echo "due=false" >> "$GITHUB_OUTPUT"
                      echo "prep=true" >> "$GITHUB_OUTPUT";;
            *)        echo "due=false" >> "$GITHUB_OUTPUT"
                      echo "prep=false" >> "$GITHUB_OUTPUT";; esac

      - name: Find out what is actually listed (rebalance + preview days)
        if: steps.due.outputs.prep == 'true'
        # data/bhavcopy/ is gitignored, so a CI runner has NONE of it. Without
        # this step refetch_all's new-listing lookup finds no bhavcopy, returns an
        # empty set, and silently falls back to "whatever was already cached" —
        # which is the exact decay this was built to stop. The fix worked on a
        # laptop and was a no-op in the one place it matters.
        #
        # Only the last two weeks are needed: this answers "what is trading NOW",
        # not "what traded in 2016". The full archive is for point-in-time
        # backtests and is rebuilt separately when research needs it.
        #
        # continue-on-error: missing new listings for one cycle is a real cost but
        # a small one; failing here would strand the rebalance AND the day's mark.
        continue-on-error: true
        run: |
          python scripts/fetch_bhavcopy.py \
            --start "$(date -u -d '15 days ago' +%Y-%m-%d)" \
            --end "$(date -u +%Y-%m-%d)"

      - name: Refresh the sector labels (rebalance + preview days)
        if: steps.due.outputs.prep == 'true'
        # The sector cap is enforced ONLY for names that carry a label; unmapped
        # names are treated as their own sector and escape it entirely. The map
        # was built by hand once and never refreshed, so every company listed
        # since was unlabelled by construction — 7 of the top 20 on 2026-08-09.
        # A risk control that silently switches off for the best-scoring names is
        # worse than none, because the config still says it is on.
        continue-on-error: true
        run: python scripts/fetch_sector_map.py

      - name: Rebuild the price cache (rebalance + preview days)
        if: steps.due.outputs.prep == 'true'
        # config/universe_tickers.json is the pinned name list, committed for
        # exactly this reason: it is what lets a cacheless runner rank the January
        # book against the SAME opportunity set the book was opened with, instead
        # of against whatever happens to be fetchable that morning.
        run: python scripts/refetch_all.py

      - name: Record the ranking (preview days — no trading)
        if: steps.due.outputs.prep == 'true' && steps.due.outputs.due != 'true'
        # The rehearsal. Everything a rebalance does except the part that trades,
        # so the heads-up a week out shows a CURRENT ranking rather than one from
        # the last rebalance six months ago — and so a broken cache or a dead data
        # source surfaces while there is still a week left to fix it.
        continue-on-error: true
        run: python scripts/paper_track.py signals

      - name: Rebalance
        if: steps.due.outputs.due == 'true'
        # No --force. The cadence IS the strategy; overriding it from a scheduled
        # job would make every run a potential off-cadence rebalance, which
        # Mandate §6 forbids and which the ledger would then have to disclose.
        # The weekend and trading-holiday guards live in paper_track.py — one
        # guard at the root, not one per caller.
        run: python scripts/paper_track.py rebalance

      - name: Mark the paper book to market
        run: |
          python scripts/paper_track.py status
          python scripts/paper_track.py export

      - name: Merge live data into the dashboard feed
        run: |
          python - <<'PY'
          import json, datetime
          doc  = json.load(open("docs/data/mark6.json"))
          live = json.load(open("data/paper/paper_export.json"))
          doc["live"] = live
          doc["generated"] = datetime.datetime.now(datetime.timezone.utc).astimezone().isoformat(timespec="seconds")
          json.dump(doc, open("docs/data/mark6.json", "w"), indent=1, default=float)
          print(f"live day {live['days_live']}  NAV {live['nav']:.0f}  {live['return_pct']:+.2f}%")
          PY

      - name: Pre-render the bot's answers
        # So an always-on webhook can reply instantly without running pandas.
        # Every answer is a function of the daily mark, so a pre-rendered reply is
        # exactly as fresh as a computed one — and all the formatting stays here,
        # in Python, rather than being duplicated in whatever serves it.
        continue-on-error: true
        run: python scripts/bot.py --render docs/data

      - name: Rebuild the standalone dashboard from the feed
        # docs/index.html EMBEDS mark6.json rather than fetching it, so updating the
        # feed alone leaves the standalone page frozen at whatever it was built with.
        # It silently drifted 4 days and kept serving a superseded headline.
        run: python docs/build_dashboard.py

      - name: Commit if anything moved
        # Runs BEFORE the health check, deliberately. The ledger and NAV log are
        # append-only evidence: a day's mark that is computed but never committed
        # is a hole in the record that no later run backfills. Recording is
        # unconditional; judging what was recorded happens next.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # config/ matters: the preview and rebalance steps regenerate the
          # sector map and re-pin the universe, and without this those are
          # rebuilt in CI and then thrown away — so the next run starts from the
          # stale committed copies and the refresh accomplishes nothing.
          git add docs/data/ docs/index.html data/paper/ config/
          git diff --staged --quiet || git commit -m "chore: daily live refresh [skip ci]"
          git push

      - name: Health check (fails the run if an invariant broke)
        env:
          GH_TOKEN: ${{ github.token }}
        # No `|| echo`. healthcheck.py exits 1 on any FAIL and that is the whole
        # point of it: this step was named "fails the run if an invariant broke"
        # while swallowing the exit code, so 20+ checks could not stop anything.
        # A guard that cannot fail is decoration. Now the run goes red and the
        # failure is visible, without costing the day's mark.
        run: python scripts/healthcheck.py

      - name: Send the daily message
        # `always()` is the whole point. The 4-5 August outage went unnoticed for
        # two days because nothing in this system ever spoke first; a notifier
        # that stays silent exactly when the health check fails would recreate
        # that hole, and worse, silence would start to mean "fine".
        #
        # notify.py runs healthcheck itself rather than reading the step above.
        # Piping that step into a file would need `pipefail` to preserve its exit
        # code, and a health check that cannot turn the run red is decoration.
        # Twenty seconds of duplicated requests is the cheaper mistake.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/notify.py --send

      - name: Dead-man's switch
        # The one failure this repo cannot detect from the inside: the job never
        # running. Every guard here — 24 health checks, the notifier, the ledger
        # watermark — is code that has to EXECUTE to protect anything. If GitHub
        # disables this workflow (it does that to public repos after 60 days of
        # inactivity), or the schedule breaks, or the repo is archived, all of it
        # goes quiet together and silence is indistinguishable from a calm market.
        #
        # So the liveness signal is inverted and moved OUTSIDE GitHub: an external
        # monitor expects a ping every day and alerts the owner when one does not
        # arrive. Absence of a message becomes the alarm rather than the failure.
        #
        # always(), because the question is "did this run?", not "did it pass?" —
        # a failing health check already reaches the owner through the message
        # above, and double-alerting trains people to ignore both.
        if: always()
        env:
          DEADMAN_URL: ${{ secrets.DEADMAN_URL }}
        run: |
          if [ -z "$DEADMAN_URL" ]; then
            echo "::warning::DEADMAN_URL not set — nothing is watching whether this job runs"
            exit 0
          fi
          SUFFIX=""
          if [ "${{ job.status }}" != "success" ]; then SUFFIX="/fail"; fi
          # Never fail the run on a ping problem: the monitor is a safety net, and
          # a safety net that can knock down the thing it protects is a liability.
          curl -fsS -m 15 --retry 3 "${DEADMAN_URL}${SUFFIX}" \
            && echo "pinged${SUFFIX}" \
            || echo "::warning::dead-man ping failed — the day's record is unaffected"
