name: Telegram webhook control

# Switches how Telegram delivers updates, WITHOUT anyone handling the token.
# The token is already a repository secret, so these admin calls run here
# instead of in a terminal — nothing is pasted into a shell, a chat, or a
# history file.
#
#   status  — which mode is live right now
#   enable  — push updates to the Netlify function (instant replies)
#   disable — back to bot.yml polling (the slow fallback)
#
# Why: GitHub delivered 5 of bot.yml's 144 requested runs in 24h (3.5%), worst
# gap 12.5 hours, so a /command could wait half a day. A webhook is pushed on
# send and uses no scheduled runs at all.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status = check | enable = webhook | disable = polling"
        type: choice
        default: status
        options:
          - status
          - enable
          - disable

permissions:
  contents: read

concurrency:
  group: telegram-delivery-mode
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      HOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      HOOK_URL: https://kavinjain.in/.netlify/functions/telegram
      ACTION: ${{ inputs.action }}
    steps:
      - name: Check the credentials this action needs
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is not set"
            exit 1
          fi
          if [ "$ACTION" = "enable" ] && [ -z "$HOOK_SECRET" ]; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET is not set. Without it the"
            echo "::error::function URL is an open relay for anyone who finds it."
            exit 1
          fi

      # Form fields, not inline JSON: a nested command substitution inside a
      # quoted YAML scalar is what broke the first version of this file, and
      # GitHub silently fell back to treating it as unparseable.
      - name: Apply
        run: |
          API="https://api.telegram.org/bot${TOKEN}"
          case "$ACTION" in
            status)
              curl -sS "$API/getWebhookInfo" | python3 -m json.tool
              ;;
            enable)
              curl -sS -X POST "$API/setWebhook" \
                -d "url=$HOOK_URL" \
                -d "secret_token=$HOOK_SECRET" \
                -d "drop_pending_updates=true" \
                -d 'allowed_updates=["message","callback_query"]' \
                | python3 -m json.tool
              echo "--- verifying ---"
              sleep 3
              curl -sS "$API/getWebhookInfo" | python3 -m json.tool
              ;;
            disable)
              curl -sS -X POST "$API/deleteWebhook" \
                -d "drop_pending_updates=false" | python3 -m json.tool
              echo "Polling restored - bot.yml picks updates up again."
              ;;
          esac

      - name: How to read that
        if: always()
        run: |
          echo 'url set + pending_update_count 0  -> webhook live, replies instant'
          echo 'url empty                         -> polling, replies wait on cron'
          echo 'last_error_message present        -> Netlify rejected it; the'
          echo '                                     secret likely differs between'
          echo '                                     Netlify and GitHub'
